server:
  port: 8081

spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/ser_service_db
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

eureka:
  client:
    service-url:
      defaultZone: http://discovery-service:8761/eureka/